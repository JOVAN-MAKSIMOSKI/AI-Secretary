# CI/CD: build both service images and push to GHCR on every push to main or test.
# Deploy (SSH to the VPS) runs for main only — the test branch has no server yet
# (dockerdeploymentplan.md Phase 9). Rollback: IMAGE_TAG=<previous-sha> docker compose up -d.
name: deploy

on:
  push:
    branches: [main, test]
  # Gate pull requests too — otherwise a broken chain is only caught once it is
  # already on main, which is too late to be worth gating.
  pull_request:
    branches: [main, test]

jobs:
  # Quality gate — nothing is built or deployed unless this passes.
  # Because `build` needs `check` and `deploy` needs `build`, a failing eval here
  # blocks the deploy with no extra gating logic.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # corepack reads the packageManager pin from root package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable

      - run: pnpm install --frozen-lockfile --filter agent...

      # @prisma/client exports nothing until the client is generated, and pnpm 10
      # blocks dependency postinstall scripts by default — on a fresh runner the module
      # is empty and tsc fails with TS2305. Same command the agent Dockerfile runs.
      # Generation is offline; no DATABASE_URL needed.
      - name: Generate Prisma client
        run: pnpm --filter agent exec prisma generate

      - name: Type-check agent (tsc strict, no emit)
        run: pnpm --filter agent type-check

      # apps/python reads the waste reference lists from generated JSON, but
      # wasteChapters.ts is their only source. Regenerate and fail on any diff so a code
      # map edited on one side can never silently disagree with the other.
      - name: Waste reference JSON matches wasteChapters.ts
        run: |
          pnpm --filter agent gen:waste-reference
          git diff --exit-code apps/python/resources/waste_reference.json

      # Step order is deliberate: every free deterministic check runs before the one
      # step that spends money, so a broken build never buys API calls to find out.

      # Gate A — offline, no credentials. Chain routing coverage, plus pure calendar
      # payload validation and local-time arithmetic.
      - name: Eval gate A — routing coverage + handler logic (offline)
        run: pnpm --filter agent eval:offline

      - uses: astral-sh/setup-uv@v5
      - name: Sync python env exactly from uv.lock
        run: uv sync --frozen
        working-directory: apps/python
      - name: Syntax-check python service
        run: uv run python -m compileall -q main.py routers services models scripts
        working-directory: apps/python

      # Gate A (python half) — prompt-injection guards for the waste-law RAG corpus.
      # Pure functions: no Qdrant, no model load, no network, ~2s.
      - name: Eval gate A — python RAG injection guards
        run: uv run pytest -q
        working-directory: apps/python

      # Gate C — two paid python evals, each with its own self-skip:
      #  - retrieval recall: skips (~2s, no model load) unless a Qdrant collection is
      #    reachable — it is not in CI today (qdrant_data/ is gitignored, e5-large is
      #    ~2GB). Enabling it later means setting QDRANT_URL, not editing this file,
      #    plus a cached or hosted embedding model.
      #  - extraction field accuracy (layer 1): runs whenever EVALAPIKEY is present.
      #    Calls the extraction chains directly — no FastAPI boot, no Supabase (the
      #    eval passes owner_auth_id=None, and eval_env.py sets import-guard values).
      - name: Eval gate C — retrieval recall + extraction accuracy
        env:
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          QDRANT_COLLECTION: ${{ vars.QDRANT_COLLECTION }}
          EVALAPIKEY: ${{ secrets.EVALAPIKEY }}
        run: uv run pytest evals/ -q
        working-directory: apps/python

      # Gate B — live routing accuracy against the committed baseline in
      # src/evals/baseline.json. Runs last because it is the only step that costs
      # money. Self-skips when EVALAPIKEY is absent, so forks and secretless runs
      # degrade to Gate A rather than failing for a reason unrelated to code quality.
      # configureEvalEnv() pins the provider to openai and clears the free-tier
      # tokens, so nothing else needs setting here.
      - name: Eval gate B — live routing accuracy
        env:
          EVALAPIKEY: ${{ secrets.EVALAPIKEY }}
          ROUTER_LLM_MODEL: ${{ vars.ROUTER_LLM_MODEL }}
        run: pnpm --filter agent eval:routing

  build:
    needs: check
    # Pull requests stop after `check` — a PR gets the eval gate, not a pushed image.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR image names must be lowercase; the repository owner is
      # JOVAN-MAKSIMOSKI, so ${{ github.repository_owner }} cannot be used
      # directly in image tags.
      - name: Set image tag and lowercase owner
        id: vars
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          else
            echo "tag=test-${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      # Agent context is the repo root: the build needs pnpm-workspace.yaml
      # and packages/shared-types alongside apps/agent.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/agent/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.vars.outputs.owner }}/ai-secretary-agent:${{ steps.vars.outputs.tag }}
            ghcr.io/${{ steps.vars.outputs.owner }}/ai-secretary-agent:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: docker/build-push-action@v6
        with:
          context: apps/python
          file: apps/python/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.vars.outputs.owner }}/ai-secretary-python:${{ steps.vars.outputs.tag }}
            ghcr.io/${{ steps.vars.outputs.owner }}/ai-secretary-python:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: github.ref_name == 'main' # test branch stops after build — no deploy target yet
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/ai-secretary && docker compose pull && docker compose up -d && docker image prune -f

      # Post-deploy smoke check: fails the workflow loudly if either service is
      # not answering over TLS after the deploy. Runs only once the repository
      # variables (Settings -> Secrets and variables -> Actions -> Variables)
      # AGENT_PUBLIC_URL / PYTHON_PUBLIC_URL are set, i.e. once a domain exists.
      - name: Smoke check agent /healthz
        if: vars.AGENT_PUBLIC_URL != ''
        run: curl -fsS --retry 10 --retry-delay 15 --retry-all-errors "${{ vars.AGENT_PUBLIC_URL }}/healthz"

      - name: Smoke check python /healthz
        if: vars.PYTHON_PUBLIC_URL != ''
        run: curl -fsS --retry 10 --retry-delay 15 --retry-all-errors "${{ vars.PYTHON_PUBLIC_URL }}/healthz"
