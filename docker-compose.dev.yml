# Local dev only: real Qdrant server for the waste-law RAG store, replacing
# embedded/local-path mode (single-writer, wiped by ingest.py's default
# delete+recreate). apps/agent and apps/python still run natively here —
# this file starts Qdrant only. Not used in production; see
# docker-compose.prod.yml for the VPS stack (separate, out of scope).
name: ai-secretary-dev

services:
  qdrant:
    image: qdrant/qdrant:v1.18.0
    container_name: ai-secretary-qdrant-dev
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data_dev:/qdrant/storage

volumes:
  qdrant_data_dev: {}
