version: '3.9'

services:
  agent:
    build: ./apps/agent
    ports:
      - '3001:3001'
    env_file: .env
    depends_on:
      - supabase

  python:
    build: ./apps/python
    ports:
      - '8000:8000'
    env_file: .env

  supabase:
    image: supabase/supabase-local:latest
    ports:
      - '54321:54321'
    env_file: .env
