# rvc-python (optional RVC voice conversion) is intentionally not listed: it is
# lazily imported in tts/rvc.py, unused unless RVC_MODEL_PATH is set, and its
# dependency tree is too heavy to lock into every deploy. Install manually when
# needed: uv pip install rvc-python

[tool.pytest.ini_options]
# pythonpath="." so tests import `services.*` the same way the app does; without it
# pytest puts only tests/ on sys.path and every service import fails.
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv]
# pywin32 is portalocker's Windows-only transitive dep. Constrained to the
# version already installed so `uv sync` never needs to swap its DLLs while
# the service is running (they are locked by the loaded process on Windows).
constraint-dependencies = ["pywin32==311"]

# Linux (Docker) resolves torch from PyTorch's CPU-only wheel index — the
# deployment VPS has no GPU, and the default CUDA wheels would drag ~10 GB of
# nvidia-* libraries into the image. The sys_platform marker leaves Windows
# dev resolution untouched.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
