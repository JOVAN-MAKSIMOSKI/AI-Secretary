# Production compose — deployed to /opt/ai-secretary/docker-compose.yml on the VPS.
# Only Caddy publishes public ports; agent/python/qdrant live on the internal network.
name: ai-secretary

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [web, internal]
    depends_on:
      agent: { condition: service_healthy }
      python: { condition: service_healthy }

  agent:
    image: ghcr.io/jovan-maksimoski/ai-secretary-agent:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: /opt/ai-secretary/agent.env
    environment: { PORT: "3000" }
    networks: [internal]
    depends_on:
      python: { condition: service_healthy }

  python:
    image: ghcr.io/jovan-maksimoski/ai-secretary-python:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: /opt/ai-secretary/python.env
    environment:
      QDRANT_URL: http://qdrant:6333
      HF_HOME: /data/hf-cache
      # LlamaIndex ignores HF_HOME; without this the embed model re-downloads
      # onto the ephemeral container fs on every redeploy
      LLAMA_INDEX_CACHE_DIR: /data/hf-cache/llama_index
    volumes: [hf_cache:/data/hf-cache]
    networks: [internal]
    depends_on:
      qdrant: { condition: service_healthy }

  qdrant:
    image: qdrant/qdrant:v1.18.0
    restart: unless-stopped
    # Loopback only — admin/migration access via SSH tunnel, never public
    ports: ["127.0.0.1:6333:6333"]
    volumes: [qdrant_data:/qdrant/storage]
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s

networks: { web: {}, internal: {} }
volumes: { caddy_data: {}, caddy_config: {}, qdrant_data: {}, hf_cache: {} }
